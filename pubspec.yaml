name: blinkbuy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  animate_do: ^5.1.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^7.3.0

  shared_preferences: ^2.5.5
  smooth_page_indicator: ^2.0.1
  flutter_svg: ^2.2.0

  dio: ^5.10.0
  flutter_bloc: ^9.1.1
  cached_network_image: ^3.4.1
  injectable: ^3.0.0
  flutter_native_splash: ^2.4.8
  google_fonts: ^8.2.0
  get_it: ^9.2.1
  pretty_dio_logger: ^1.4.0
 
 
 

dev_dependencies:


  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#EBEBEB"
  remove_alpha_ios: true



  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  injectable_generator: ^3.1.1
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
